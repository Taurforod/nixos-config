[notification]
monitors = [ "DP-1", "HDMI-A-1" ]

[osd]
monitors = [ "DP-1", "HDMI-A-1" ]

[plugins]
enabled = [ "dotnetrob/cat", "aristides/udiskie" ]

[shell]
app_icon_color = "primary"
font_family = "Inter"
password_style = "random"
polkit_agent = true

    [shell.panel]
    list_item_background = true
    open_near_click_control_center = true

    [shell.session]
    grid = true

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop" ]

[wallpaper]
directory = "/home/taurforod/Загрузки/wallpapir"
per_monitor_directories = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600

    [wallpaper.default]
    path = "/home/taurforod/Загрузки/wallpapir/0f6oxa9y9jlb1.png"

    [wallpaper.last]
    path = "/home/taurforod/Загрузки/wallpapir/wallhaven-qr2gvq.jpg"

    [wallpaper.monitor.DP-1]
    directory = "/home/taurforod/Загрузки/wallpapir"

    [wallpaper.monitor.DP-3]
    directory = "/home/taurforod/Загрузки/wallpapir"

    [wallpaper.monitor.HDMI-A-1]
    directory = "/home/taurforod/Загрузки/wallpapir"

    [wallpaper.monitors.DP-1]
    path = "/home/taurforod/Загрузки/wallpapir/wallhaven-qr2gvq.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/taurforod/Загрузки/wallpapir/wallhaven-wqj666.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/taurforod/Загрузки/wallpapir/wallhaven-6l2rk7.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/taurforod/nixos-config/assets/wallpapers/wallhaven-zp8o3j.jpg"

[widget.battery]
display_mode = "graphic"
scale = 0.85000000000000009

[widget.brightness]
show_label = false

[widget.cat]
cat_color = "primary"
cat_color_mode = "custom"
cat_size = 30
run_threshold = 50
show_cpu_percent = true
type = "dotnetrob/cat:cat"
walk_threshold = 5

[widget.clock]
format = "{:%H:%M %a, %d %b}"

[widget.launcher]
glyph = "cat"

[widget.media]
hide_when_no_media = true
max_length = 200
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.status]
type = "aristides/udiskie:status"

[widget.sysmon]
stat = "gpu_usage"
