[accessibility]
ui_scale = 1.1000000089406967

[bar.default]
background_opacity = 0.79999998211860657
center = [ "workspaces", "cat" ]
color = "primary"
end = [
    "media",
    "tray",
    "notifications",
    "keyboard_layout",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
margin_edge = 1
margin_ends = 2
padding = 10
scale = 1.1500000096857548
start = [ "launcher", "clock", "temp", "ram", "sysmon" ]
thickness = 38

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 160.0
    box_width = 240.0
    cx = 1416.0
    cy = 128.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        center_text = false
        clock_style = "digital"
        color = "primary"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 160.0
    box_width = 208.0
    cx = 1432.0
    cy = 283.89999389648438
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        color = "primary"
        show_forecast = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 160.0
    box_width = 1120.0
    cx = 768.0
    cy = 784.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false
        bands = 32
        centered = false
        mirrored = true
        show_when_idle = false

[dock]
auto_hide = true
enabled = true
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Eidsvoll verk"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 768.0
    cy = 605.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 176.0
    box_width = 400.0
    cx = 768.0
    cy = 120.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 128.0
    box_width = 736.0
    cx = 768.0
    cy = 797.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 176.0
    box_width = 288.0
    cx = 768.0
    cy = 304.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
font_family = "Inter"
password_style = "random"
polkit_agent = true

    [shell.panel]
    list_item_background = true
    open_near_click_control_center = true

    [shell.session]
    grid = true

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/taurforod/nixos-config/assets/wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600

    [wallpaper.default]
    path = "/home/taurforod/nixos-config/assets/wallpapers/wallhaven-zp8o3j.jpg"

    [wallpaper.last]
    path = "/home/taurforod/nixos-config/assets/wallpapers/wallhaven-zp8o3j.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/taurforod/nixos-config/assets/wallpapers/wallhaven-zp8o3j.jpg"

[widget.battery]
display_mode = "graphic"
scale = 0.85000000000000009

[widget.brightness]
show_label = false

[widget.cat]
cat_color = "primary"
cat_color_mode = "custom"
cat_size = 30
run_threshold = 50
show_cpu_percent = true
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.clock]
format = "{:%H:%M %a, %d %b}"

[widget.launcher]
glyph = "cat"

[widget.media]
hide_when_no_media = true
max_length = 90
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.sysmon]
stat = "gpu_usage"
